[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "adclip"
version = "0.1.1"
description = "MCP server for ad creative generation — copy and static images from a single JSON brief"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Adam Steen", email = "dreliq9@gmail.com" },
]
keywords = ["mcp", "ads", "advertising", "claude", "llm", "creative", "meta-dco"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "click>=8.1",
    "pydantic>=2.0",
    "Pillow>=10.0",
    "mcp>=1.2.0",
    "av>=12.0",
    "fal-client>=0.13",
]

[project.urls]
Homepage = "https://github.com/dreliq9/adclip"
Repository = "https://github.com/dreliq9/adclip"
Issues = "https://github.com/dreliq9/adclip/issues"

[project.scripts]
adclip = "adclip.cli:main"
adclip-mcp = "adclip.mcp.server:main"

[project.optional-dependencies]
anthropic = [
    "anthropic>=0.40",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
